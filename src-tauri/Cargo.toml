[package]
name = "scriptlauncher"
version = "0.9.1"
edition = "2021"

[lib]
name = "scriptlauncher_lib"
crate-type = ["rlib"]

[[bin]]
name = "scriptlauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.5.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2.0"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
open = "5.3.4"
tauri-plugin-global-shortcut = "2.3.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
